[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openrct2-ridecreation-mcp"
version = "0.1.0"
description = "MCP server for roller coaster creation in OpenRCT2"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=4.0.3,<5",
    "Pillow>=12.3.0,<13",
    "pydantic>=2.13.5,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
]

[project.scripts]
openrct2-mcp = "openrct2_mcp.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/openrct2_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/scripts",
    "/docs",
    "/skills",
    "/scenarios",
    "/ridecreation-api.js",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
    "/uv.lock",
    "/pytest.ini",
]
