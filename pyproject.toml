[build-system]
requires = ["hatchling", "pydantic>=2.13.5,<3"]
build-backend = "hatchling.build"

[project]
name = "openrct2-mcp"
version = "0.1.0"
description = "MCP tools for OpenRCT2 construction and park management"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=4.0.3,<5",
    "Pillow>=12.3.0,<13",
    "pydantic>=2.13.5,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
]

[project.scripts]
openrct2-mcp = "openrct2_mcp.mcp_server:main"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

# Rebuild editable bindings when their definition or generator changes.
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "hatch_build.py" },
    { file = "scripts/generate_actions.py" },
    { file = "scripts/audit_game_api.py" },
    { file = "docs/game-api-surface.json" },
    { file = "docs/game-api-policy.json" },
    { file = "docs/custom-tools.json" },
    { file = "src/openrct2_mcp/actions.json" },
]

[tool.hatch.build.targets.wheel]
packages = ["src/openrct2_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/scripts",
    "/docs",
    "/skills",
    "/scenarios",
    "/openrct2-mcp.js",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
    "/hatch_build.py",
    "/uv.lock",
    "/pytest.ini",
]
