name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: git diff --exit-code -- ridecreation-api.js src/openrct2_mcp/_action_client.py src/openrct2_mcp/_action_tools.py README.md docs/api-coverage.md
      - run: uv run --locked pytest src/tests
      - run: uv run --locked python scripts/check_install.py
